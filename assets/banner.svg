<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#312e81;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#6366f1;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Grid / Network Overlay -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Floating Graphic Elements -->
  <g filter="url(#glow)">
    <circle cx="150" cy="100" r="4" fill="#38bdf8">
      <animate attributeName="cy" values="100;90;100" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="300" r="6" fill="#c084fc">
      <animate attributeName="cy" values="300;315;300" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="80" r="5" fill="#818cf8">
      <animate attributeName="cy" values="80;70;80" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Proposal Document Graphic Icon -->
  <g transform="translate(100, 110)" filter="url(#glow)">
    <rect x="0" y="0" width="140" height="180" rx="12" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" />
    <line x1="25" y1="40" x2="115" y2="40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="70" x2="95" y2="70" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="95" x2="105" y2="95" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="120" x2="75" y2="120" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Checkmark Badge -->
    <circle cx="110" cy="150" r="22" fill="#10b981" />
    <path d="M100 150 L107 157 L120 142" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Title & Subtitle Text -->
  <g text-anchor="start" transform="translate(280, 160)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Awesome Proposal Management 📑✨
    </text>

    <!-- Subtitle -->
    <text x="0" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
      Curated Sales Proposals, CPQ, E-Signatures, RFPs &amp; Digital Sales Rooms Ecosystem
    </text>

    <!-- Tag Pills -->
    <g transform="translate(0, 85)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="65" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">💼 Commercial SaaS</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="145" height="34" rx="17" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1.5" />
      <text x="217" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#818cf8" text-anchor="middle">⚡ Open-Source Stack</text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="140" height="34" rx="17" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1.5" />
      <text x="375" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#c084fc" text-anchor="middle">📊 Market Insights</text>
    </g>
  </g>
</svg>
